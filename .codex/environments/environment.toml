# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "zmk-module-template-with-custom-studio-rpc"

[setup]
script = '''
# Copy-on-write copy that works on both Linux and macOS, falling back to a plain
# copy when the filesystem/tooling has no reflink support. GNU coreutils uses
# `--reflink=auto`; BSD/macOS `cp` uses `-c` (clonefile).
cow_copy() {
    if cp -R --reflink=auto "$1" "$2" 2>/dev/null; then
        return 0
    fi
    if cp -cR "$1" "$2" 2>/dev/null; then
        return 0
    fi
    cp -R "$1" "$2"
}

if [ ! -d "$CODEX_SOURCE_TREE_PATH/dependencies" ]; then
    (
        cd "$CODEX_SOURCE_TREE_PATH"
        if [ ! -d .west ]; then
            west init -l west --mf west-test-isolated.yml
        fi
        west update --narrow
        west zephyr-export
    )
fi

if [ ! -d "$CODEX_SOURCE_TREE_PATH/web/node_modules" ]; then
    (
        cd "$CODEX_SOURCE_TREE_PATH/web"
        npm install
    )
fi

if [ -d "$CODEX_SOURCE_TREE_PATH/dependencies" ]; then
    cow_copy "$CODEX_SOURCE_TREE_PATH/dependencies" "$CODEX_WORKTREE_PATH/" || echo "failed to copy dependencies"
else
    echo "source dependencies directory not found; skipping copy"
fi

if [ -d "$CODEX_SOURCE_TREE_PATH/web/node_modules" ]; then
    mkdir -p "$CODEX_WORKTREE_PATH/web"
    cow_copy "$CODEX_SOURCE_TREE_PATH/web/node_modules" "$CODEX_WORKTREE_PATH/web/" || echo "failed to copy web/node_modules"
else
    echo "source web/node_modules directory not found; skipping copy"
fi
'''
