name: Test and Build Web UI

on:
  push:
    branches:
      - "main+custom-studio-protocol"
      - "main"
    paths:
      - "web/**"
      - ".github/workflows/web-ui.yml"
      - "proto/**"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ui.yml"
      - "proto/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Generate types from proto
        run: npm run generate
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build for Cloudflare Workers Preview
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run build
        env:
          VITE_BASE: /
      - name: Build for github pages
        if: ${{ github.event_name == 'push' }}
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Upload build artifact
        # Only consumed by the `preview` job on pull requests; push deploys use
        # the separate pages artifact below.
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Upload static files as artifact
        if: ${{ github.event_name == 'push' }}
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  release:
    needs: build
    if: ${{ github.event_name == 'push' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # GitHub Actions cannot reference `secrets` in a job-level `if`, so surface
  # whether the Cloudflare secrets are configured as a job output that the
  # preview jobs below can gate on.
  cf-check:
    needs: build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.cf.outputs.enabled }}
    steps:
      - name: Check Cloudflare secrets
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets not configured; skipping preview deploy. See README 'Publishing Web UI'."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  preview:
    needs: [build, cf-check]
    if: ${{ needs.cf-check.outputs.enabled == 'true' }}
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    environment:
      name: approval-required
      url: ${{ steps.deploy.outputs.deployment-url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--name` is the Cloudflare Workers project name, shared by all PRs of
          # this repo. Change it if you fork the template into your own account.
          command: versions upload --assets dist --name zmk-module-web-ui --compatibility-date 2026-01-11
          wranglerVersion: '4.58.0'
          workingDirectory: web

      - name: Comment PR with deployment URL
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🚀 Cloudflare Workers Preview

            **Preview URL:** ${{ steps.deploy.outputs.deployment-url }}

            <sub>Deployed from commit ${context.sha.substring(0, 7)}</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Cloudflare Workers Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  # Runs instead of `preview` when the Cloudflare secrets are absent (e.g. a
  # fresh repo created from this template). Keeps CI green and tells the PR
  # author how to turn previews on, without an environment/approval gate.
  preview-disabled:
    needs: [build, cf-check]
    if: ${{ github.event_name == 'pull_request' && needs.cf-check.outputs.enabled != 'true' }}
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment PR that preview is disabled
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🚀 Cloudflare Workers Preview

            ⚠️ Preview deploys are **disabled**: the \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` repository secrets are not configured.

            To enable per-PR previews, add both secrets under **Settings → Secrets and variables → Actions**. See the "Publishing Web UI" section of the README for details.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Cloudflare Workers Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
