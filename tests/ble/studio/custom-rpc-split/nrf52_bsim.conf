# Shared by the split central (DUT) and the peripheral build. The module (and
# ZMK's split event-relay, which the split-relay sample follows directly) is
# enabled on BOTH halves so the peripheral compiles the relay listener
# (src/split/template_relay.c).
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_TEMPLATE_FEATURE=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
