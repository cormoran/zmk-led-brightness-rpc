include:
  - artifact: module_template_board_feature_disabled
    board: xiao_ble//zmk
    shield: tester_xiao

  - artifact: module_template_board_with_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_TEMPLATE_FEATURE=y -DCONFIG_ZMK_TEMPLATE_FEATURE_STUDIO_RPC=y
    snippet: studio-rpc-usb-uart

  - artifact: module_template_board_without_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_TEMPLATE_FEATURE=y

  - artifact: custom_settings_board
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_TEMPLATE_FEATURE=y -DCONFIG_ZMK_TEMPLATE_FEATURE_STUDIO_RPC=y -DCONFIG_ZMK_CUSTOM_SETTINGS=y -DCONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
    snippet: studio-rpc-usb-uart

  # Hardware-free Renode testing (see README.md's "Hardware-free Renode
  # testing" section). Uses the renode-studio-uart snippet from
  # cormoran/zmk-workspace (a test-only west dependency, see
  # west/west-dependency/west-test-dependency.yml) in place of the real
  # USB-carried studio-rpc-usb-uart snippet -- Renode's nRF52840 USBD model
  # can't present a host-openable CDC port, so this binds Studio RPC (and
  # the console) to real UART peripherals instead; see that snippet's own
  # overlay for the full story. Produces zephyr/zmk.elf (not a flashable
  # .uf2 target on real hardware -- the pinctrl/overlay it uses is
  # emulation-only).
  - artifact: renode_smoke_test
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_TEMPLATE_FEATURE=y -DCONFIG_ZMK_TEMPLATE_FEATURE_STUDIO_RPC=y
    snippets:
      - renode-studio-uart
