include:
  - artifact: module_template_board_feature_disabled
    board: xiao_ble//zmk
    shield: tester_xiao

  - artifact: module_template_board_with_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_TEMPLATE_FEATURE=y -DCONFIG_ZMK_TEMPLATE_FEATURE_STUDIO_RPC=y
    snippet: studio-rpc-usb-uart

  - artifact: module_template_board_without_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_TEMPLATE_FEATURE=y

  - artifact: custom_settings_board
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_TEMPLATE_FEATURE=y -DCONFIG_ZMK_TEMPLATE_FEATURE_STUDIO_RPC=y -DCONFIG_ZMK_CUSTOM_SETTINGS=y -DCONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
    snippet: studio-rpc-usb-uart

  # Hardware-free Renode testing (see README.md) -- the `wired-split` mode of
  # zmk-west-commands' `west zmk-renode-test`. A wired split pair: the central
  # answers Studio RPC over the emulated USB CDC (tests/renode/renode_test.py),
  # the smoke also asserts a peripheral keypress reaches the central. Shields
  # come from zmk-west-commands (renode_usb_wired_split / renode_wired_split).
  # Emulation-only images (USB/split pinctrl), not flashable as-is.
  #
  # The module's split-relay sample is NOT built here: relay-over-wired needs a
  # newer zmk than the pin (fffa339 relays only over BLE, so a BLE-off wired
  # half fails to link). That path is covered by the BabbleSim BLE test. To
  # re-enable once the pin advances: add CONFIG_ZMK_SPLIT_RELAY_EVENT to both
  # halves and restore the relay assertion in renode_test.py.
  - artifact: usb_wired_central
    board: xiao_ble//zmk
    shield: renode_usb_wired_split
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_TEMPLATE_FEATURE=y -DCONFIG_ZMK_TEMPLATE_FEATURE_STUDIO_RPC=y
    snippets:
      - studio-rpc-usb-uart

  # Plain wired peripheral (no module / no Studio): pairs over the wired link
  # and forwards key events to the central.
  - artifact: usb_wired_peripheral
    board: xiao_ble//zmk
    shield: renode_wired_split
